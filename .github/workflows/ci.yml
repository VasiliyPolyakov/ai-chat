name: CI

on:
  pull_request:
  # Feature branches are covered by their pull request; main is checked again after merge.
  push:
    branches: [main]

# A new push to the same PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

# Check jobs only call root npm scripts (`npm ci` / `npm run <script>`), the same ones
# that run locally — see scripts/check-ci-parity.mjs. Job ids are the required check names.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chat_test
        ports:
          - 5432:5432
        # Steps start only after the service reports healthy.
        options: >-
          --health-cmd "pg_isready -U postgres -d chat_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # Overrides apps/api/.env.test (5433 is the local db-test port); CI-only credentials.
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/chat_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Builds the images and starts the compose stack; Docker is preinstalled on ubuntu-latest.
      - run: npm run test:infra

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the scan covers every commit, not only the last one.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # No dependencies needed: the script uses a local gitleaks or the pinned Docker image.
      - run: npm run secrets:scan

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Starts infra/compose.yml under its own project, installs the browser, runs Playwright.
      - run: npm run test:smoke

  # Publishing job: builds the images that later get deployed, tagged with the commit SHA.
  images:
    # Only after a merge into main; a red check means no image.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test, infra, gitleaks, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      # GHCR image names must be lowercase; the repository owner may not be.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.app }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          # The SHA is the version: deploy and rollback refer to it.
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Layer cache between runs, separate per image.
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
