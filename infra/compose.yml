# Local production-like stack: browser → web (Caddy) → api (Nest) → db (Postgres).
# Only web is published to the host. Canonical start:
#   docker compose -f infra/compose.yml run --rm migrate
#   docker compose -f infra/compose.yml up -d --wait api web
# Overrides: environment or infra/.env (WEB_HOST_PORT, APP_ENV, POSTGRES_PASSWORD, …).
name: chat-stack

x-api-build: &api-build
  context: ..
  dockerfile: apps/api/Dockerfile

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-production}
  APP_VERSION: ${APP_VERSION:-local}
  # Local-only default password; production values come from secrets.
  DATABASE_URL: postgres://chat:${POSTGRES_PASSWORD:-chat-local}@db:5432/chat
  REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat-local}
      POSTGRES_DB: chat
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    volumes:
      - db-data:/var/lib/postgresql/data

  # One-off job: applies pending migrations and exits (0 also when nothing is pending).
  migrate:
    build: *api-build
    restart: 'no'
    init: true
    environment: *api-env
    # Compiled data source: the runtime image has no ts-node and no src/.
    command:
      [
        'node',
        '/app/node_modules/typeorm/cli.js',
        'migration:run',
        '-d',
        'dist/database/data-source.js',
      ]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: *api-build
    restart: unless-stopped
    # Tiny init as PID 1: forwards SIGTERM to node and reaps zombies.
    init: true
    environment: *api-env
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      # Loopback only: the local stack is not exposed to the LAN.
      - '127.0.0.1:${WEB_HOST_PORT:-8080}:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:80/']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      # Certificates and Caddy state (needed once TLS is on).
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
